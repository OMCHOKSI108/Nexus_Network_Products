# Minimal Render service template for Nexus Network backend
# Copy this file to Render (or use as reference) and set env vars in the Render dashboard.

services:
  - type: web
    name: nexusnetwork-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: ./server
    # Do NOT store secrets here. Configure these in Render dashboard under Environment.
    envVars:
      - key: MONGODB_URI
        value: "${MONGODB_URI}"
      - key: JWT_SECRET
        value: "${JWT_SECRET}"
      - key: CORS_ORIGIN
        value: "${CORS_ORIGIN}"
      - key: EMAIL_USER
        value: "${EMAIL_USER}"
      - key: EMAIL_PASS
        value: "${EMAIL_PASS}"
      - key: EMAIL_FROM
        value: "${EMAIL_FROM}"
      - key: CLOUDINARY_URL
        value: "${CLOUDINARY_URL}"
      - key: OTP_TTL_SECONDS
        value: "300"
